aid: foreign-agricultural-service
name: Foreign Agricultural Service
description: >-
  The Foreign Agricultural Service (FAS) is the trade and export agency of the United States
  Department of Agriculture (USDA), working to promote U.S. agricultural exports and expand
  global markets for American agricultural products. FAS runs the Open Data Services at
  apps.fas.usda.gov, a free, key-gated HTTPS/JSON API publishing three datasets on U.S. and
  world agricultural trade: ESR (Export Sales Reporting — weekly U.S. export sales by
  commodity, destination and market year), GATS (the Global Agricultural Trade System —
  U.S. Census and UN ComTrade import, export and re-export flows, including trade by U.S.
  customs district), and PSD (Production, Supply and Distribution — world commodity
  production, supply and use forecasts). The surface is 35 read-only GET operations behind a
  single API_KEY header, described by a live Swagger 2.0 contract and rendered in Swagger UI.
