domain_standards:
  note: >-
    REWARD-ONLY, and asserted narrowly. FAS is not an identity or messaging provider, so the
    government regime shortlist (dcat, ckan, eidas, fedramp, open-data-charter) has no match
    in this contract — none of those vocabularies appears in it, and no DCAT or CKAN catalog
    endpoint exists. What the contract DOES declare is the classification vocabulary of its
    own market, international agricultural trade, and that is recorded here with the exact
    contract location rather than inferred from prose.
  standards:
    - id: wco-harmonized-system
      name: WCO Harmonized Commodity Description and Coding System (HS6 and HS10)
      conforms: true
      evidence: >-
        openapi/_original/foreign-agricultural-service-fas-open-data-swagger.json. Two levels
        of the same standard are declared in operation summaries: GATSData_GetHS6Commodities
        (/api/gats/HS6Commodities) — "Commodities classified at a broader level of
        classification, at the HS6 Level, as opposed to HS10 Level. Use this to correlate the
        Import, Export and Re-export data records obtained by querying UN Trade Data"; and
        GATSData_GetCommodities (/api/gats/commodities) — "Commodity record contains HS10 Code
        and Census and FAS Unit Of Measure IDS". The GATS dataset is keyed on HS codes, so a
        consumer who already speaks HS integrates against these responses with no bespoke
        crosswalk.
      limit_of_claim: >-
        The contract exposes HS6 codes as data; it does not declare an HS schema URN or a
        conformance class. This is an identifier-scheme conformance, which is the strongest
        form available in this market, and it is stated as such rather than dressed up as a
        certified profile.
    - id: un-comtrade-reporter-codes
      name: UN ComTrade reporter / partner country coding
      conforms: true
      evidence: >-
        Five operations key on UN ComTrade identifiers — GATSData_GetUNTradeExports,
        GATSData_GetUNTradeImports and GATSData_GetUNTradeReExports each take
        {reporterCode}/{year}, and two release-date operations sit under
        /api/gats/UNTrade/data/. The GATSData_GetUNTradeExports summary states the coding
        explicitly: "Given Reporter Code (Ex IN for India), and Export Year (for ex, 2010),
        this API End point returns a list of records of Commodity Export data as reported by
        UN COMTrade for a given year. UN COMTrade reports data on a yearly basis at a HS6 Code
        Level." FAS republishes UN ComTrade trade flows under UN ComTrade's own reporter
        coding rather than a FAS-local country id.
      limit_of_claim: >-
        The Census-sourced half of GATS (censusExports/censusImports/censusReExports and the
        customs-district operations) uses {partnerCode}, a US Census Schedule C/D coding, not
        the UN scheme. The two coexist in one API and a consumer must know which is which —
        the contract does not say, and that is a real integration hazard worth naming.
    - id: us-census-schedule-d-customs-districts
      name: US Census customs district coding
      conforms: true
      evidence: >-
        /api/gats/customsDistricts (GATSData_GetCustomsDistricts) plus the three
        customsDistrict{Exports,Imports,ReExports} operations expose the US Census customs
        district dimension of the same trade flows.
