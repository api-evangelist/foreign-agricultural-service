integration_note: >-
  The three datasets do not share a key. A question that spans them — "what did the US sell
  into a market that its own production forecast said would be short?" — requires the consumer
  to build a crosswalk between FAS commodity codes (ESR/PSD), HS10 (GATS Census) and HS6 (GATS
  UN ComTrade), and between FAS country codes, Census partner codes and UN ComTrade reporter
  codes. The API publishes each vocabulary but no mapping between them, and that missing
  crosswalk is the main integration cost of this surface.
