note: >-
  DERIVED FROM PATHS AND PARAMETERS, NOT FROM SCHEMAS — and that distinction is the finding.
  The provider's Swagger declares `definitions: {}` (zero named schemas) and types every one
  of its 35 responses as `schema: {type: object}`. There is no $ref anywhere in the contract,
  so there is no schema graph to walk. What CAN be derived honestly is the entity graph the
  API's own URL structure and its 37 path parameters describe: seven code-typed identifiers
  (commodityCode, countryCode, partnerCode, reporterCode, marketYear, year, month) that the
  reference operations define and the data operations join on. Field names inside response
  bodies are NOT recorded here, because they were never fetched — API Evangelist holds no FAS
  API key — and guessing them is the exact fabrication this pipeline forbids.
