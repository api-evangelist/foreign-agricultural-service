  department-level security.txt would legitimately cover it — it does not serve one either.
  Two distinct edge behaviours were observed and are recorded per row rather than collapsed:
  www.fas.usda.gov / www.usda.gov are fronted by Akamai, which returns 403 "Access Denied"
  (edgesuite reference id) for every /.well-known/* path including the negative control, while
  /llms.txt and /.well-known/security.txt reach the Drupal origin and return a real 404. The
  API host apps.fas.usda.gov (ASP.NET) returns 500 for any /.well-known/* path — an unhandled
  route, not a document. None of these is a served discovery document.
