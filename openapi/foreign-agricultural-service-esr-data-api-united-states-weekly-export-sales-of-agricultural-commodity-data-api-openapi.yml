      tags:
      - ESR Data API - United States Weekly Export Sales of Agricultural Commodity Data
      summary: Returns a set of records with Region Codes and Region Names.
      operationId: ESRData_GetRegions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
