      summary: 'Given Commodity Code (Ex: 104 for Wheat - White ) and MarketYear (Ex: 2017)…'
      operationId: ESRData_GetAllCountriesData
      parameters:
      - name: commodityCode
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: marketYear
